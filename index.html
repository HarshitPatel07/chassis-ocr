<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chassis OCR</title>
<style>
  :root { --bg:#f5f7fa; --bar:#1f4e78; --bar-ink:#fff; --mute:#c9d6e4; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; }
  .bar { height:44px; display:flex; align-items:center; justify-content:space-between; gap:12px;
         padding:0 16px; background:var(--bar); color:var(--bar-ink); }
  .bar b { font-size:15px; } .bar span { color:var(--mute); font-size:12px; margin-left:8px; }
  .bar a { color:var(--bar-ink); font-size:12px; text-decoration:none; border:1px solid rgba(255,255,255,.4);
           padding:5px 10px; border-radius:6px; white-space:nowrap; }
  .wrap { position:relative; height:calc(100% - 44px); }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  .load { position:absolute; inset:0; z-index:1; display:grid; place-items:center; color:#6b7685; background:var(--bg); }
  .spin { width:26px; height:26px; border:3px solid var(--bar); border-right-color:transparent; border-radius:50%;
          display:block; margin:0 auto 10px; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (max-width:520px) { .bar span { display:none; } }
</style>
</head>
<body>
  <div class="bar">
    <div><b>Chassis OCR</b><span>ADCA &middot; vehicle sticker &rarr; chassis list</span></div>
    <a id="newtab" target="_blank" rel="noopener">Open in new tab &#8599;</a>
  </div>
  <div class="wrap">
    <div class="load" id="load"><div><span class="spin"></span>Loading app&hellip;</div></div>
    <iframe id="app" title="Chassis OCR" allow="clipboard-write"></iframe>
  </div>
<script>
  // Change only this line when the Apps Script deployment URL changes.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxhiuja_VFEaAwkIWcZH2YNS2JA4tpYc7jh1qzV6u-WCRFQlKvjDcuCrEn8koCt2ib3/exec';
  document.getElementById('newtab').href = APP_URL;
  var f = document.getElementById('app'), ready = false;
  // The app sends 'chassis-ocr-ready' when it shows inside this page.
  window.addEventListener('message', function (e) {
    if (e.data === 'chassis-ocr-ready') { ready = true; document.getElementById('load').style.display = 'none'; }
  });
  // If Google blocks showing it here (older deployment), open the app directly instead of a blank page.
  setTimeout(function () { if (!ready) location.replace(APP_URL); }, 6000);
  f.src = APP_URL;
</script>
</body>
</html>
