<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chassis OCR</title>
<meta http-equiv="refresh" content="1; url=https://script.google.com/macros/s/AKfycbxhiuja_VFEaAwkIWcZH2YNS2JA4tpYc7jh1qzV6u-WCRFQlKvjDcuCrEn8koCt2ib3/exec">
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#1c2430; --mute:#6b7685; --line:#e3e7ee; --pri:#1f4e78; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161d; --card:#1a212b; --ink:#e6ebf1; --mute:#9aa6b4; --line:#2a3340; --pri:#5b9bd5; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; max-width:420px; text-align:center; }
  h1 { font-size:22px; margin:0 0 6px; } p { color:var(--mute); margin:0 0 18px; }
  .spin { width:28px; height:28px; border:3px solid var(--pri); border-right-color:transparent; border-radius:50%;
          display:inline-block; animation:sp .8s linear infinite; margin-bottom:14px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  a.btn { display:inline-block; background:var(--pri); color:#fff; text-decoration:none; font-weight:600; padding:10px 20px; border-radius:8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <h1>Chassis OCR</h1>
    <p>Opening the app&hellip; Photos are read by Google Drive OCR and results go to a Google Sheet.</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbxhiuja_VFEaAwkIWcZH2YNS2JA4tpYc7jh1qzV6u-WCRFQlKvjDcuCrEn8koCt2ib3/exec">Open Chassis OCR</a>
  </div>
</body>
</html>
